services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: catlink
      POSTGRES_PASSWORD: catlink
      POSTGRES_DB: catlink
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - catlink-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catlink -d catlink"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  catlink-postgres:
